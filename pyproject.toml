[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jaguar"
dynamic = ["version"]
description = "JAGUAR by anayssa — The most advanced open-source Website Intelligence Platform"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "anayssa" }]
keywords = [
    "website-intelligence",
    "security-audit",
    "seo-analysis",
    "performance",
    "accessibility",
    "website-cloner",
    "tech-stack-detection",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: Site Management",
    "Topic :: Security",
    "Typing :: Typed",
]
dependencies = [
    "click>=8.1",
    "aiohttp>=3.9",
    "rich>=13.7",
    "pydantic>=2.5",
    "beautifulsoup4>=4.12",
    "lxml>=5.1",
    "Jinja2>=3.1",
    "cssselect>=1.2",
    "aiofiles>=23.2",
    "certifi>=2024.2",
    "cryptography>=42.0",
]

[project.optional-dependencies]
browser = ["playwright>=1.41"]
lighthouse = []
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "mypy>=1.8",
    "ruff>=0.3",
    "aioresponses>=0.7",
]
all = ["jaguar[browser,dev]"]

[project.scripts]
jaguar = "jaguar.cli:main"

[project.entry-points."jaguar.analyzers"]

[project.entry-points."jaguar.reporters"]

[project.entry-points."jaguar.plugins"]

[project.urls]
Homepage = "https://github.com/anayssa/jaguar"
Repository = "https://github.com/anayssa/jaguar"
Issues = "https://github.com/anayssa/jaguar/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/jaguar"]

[tool.hatch.version]
path = "src/jaguar/__init__.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "TCH"]
ignore = ["E501", "TC003", "SIM102", "SIM105", "SIM108"]
